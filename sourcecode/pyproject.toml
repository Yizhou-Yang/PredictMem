[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictmem"
version = "0.1.0"
description = "Effect memory with an independent predictor for long-horizon agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "PredictMem Team"}]
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["predictmem*"]
