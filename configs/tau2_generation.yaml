benchmark: tau2
experiment_name: hy3_tau2_generation
tau2:
  max_steps: 200
  solver_mode: conversational
  task_split: train
  domain: retail
  user_llm: openai/hy4
  user_llm_args:
    temperature: 0.0
    reasoning_effort: high
accumulation:
  extraction_reasoning_effort: null
  extraction_model: openai/hy4
generation:
  coverage_tags_path: outputs/daedalus/hy3_tau2_generation_smoke2/coverage_tags.txt
  num_sessions: 74
  reject_multi_item_exchange: true
  withhold_discoverable_ids: true
  explorer_model: openai/hy4
  explorer_reasoning_effort: high
  judge_model: openai/hy4
  judge_reasoning_effort: high
  num_explorers: 12
category: hy3-reproduction
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
cost_accounting:
  enabled: true
  require_complete_estimates: false
run:
  num_runs: 1
  parallel: 24
