benchmark: appworld
experiment_name: hy3_appworld_train_smoke
category: hy3-smoke
appworld:
  dataset: train
run:
  num_runs: 1
  parallel: 1
  max_tasks: 1
agent:
  model: openai/hy3
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
accumulation:
  extraction_model: openai/hy3
  extraction_reasoning_effort: null
generation:
  explorer_model: openai/hy3
  explorer_reasoning_effort: high
  judge_model: openai/hy3
  judge_reasoning_effort: high
cost_accounting:
  enabled: true
  require_complete_estimates: false
memory:
  enabled: false
