benchmark: tau2
experiment_name: pm_tau2_retail_ds
category: predictmem
tau2:
  domain: retail
  task_split: test
  user_llm: openai/deepseek-flash
  user_llm_args:
    temperature: 0.0
    reasoning_effort: low
predictmem:
  enabled: true
  predictor_model: openai/deepseek-flash
  judge_model: openai/deepseek-flash
  predictor_reasoning_effort: low
  tau_admit: 0.55
  control_eps: 0.25
  horizon: 1
  beam: 1
  gamma: 0.9
  gate:
    enabled: true
    tau_warn: 0.45
    tau_block: 0.75
  predict_consequential_only: true
run:
  num_runs: 5
  parallel: 8
agent:
  model: openai/deepseek-flash
  temperature: 1.0
  reasoning_effort: low
  max_turns: 30
cost_accounting:
  enabled: true
  require_complete_estimates: false
