benchmark: appworld
experiment_name: hy3_appworld
appworld:
  dataset: train
accumulation:
  max_failures: 1
  num_success_to_continue: 1
  extraction_model: openai/hy4
kind: accumulation
ace:
  playbook_path: outputs/baselines/ace/memory/hy3_appworld/playbook.txt
  reflector_model: openai/hy4
  reflector_reasoning_effort: high
  curator_model: openai/hy4
  curator_reasoning_effort: high
category: hy3-reproduction
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
run:
  parallel: 1
cost_accounting:
  enabled: true
  require_complete_estimates: false
