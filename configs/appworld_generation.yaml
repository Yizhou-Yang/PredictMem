benchmark: appworld
experiment_name: hy3_appworld_generation
appworld:
  dataset: train
accumulation:
  extraction_reasoning_effort: null
  extraction_model: openai/hy4
generation:
  num_explorers: 12
  coverage_tags_path: outputs/daedalus/hy3_appworld_generation_smoke/coverage_tags.txt
  min_novelty: 0.05
  excluded_apps:
  - gmail
  - amazon
  explorer_model: openai/hy4
  explorer_reasoning_effort: high
  judge_model: openai/hy4
  judge_reasoning_effort: high
  num_sessions: 90
category: hy3-reproduction
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
cost_accounting:
  enabled: true
  require_complete_estimates: false
run:
  num_runs: 1
  parallel: 12
