benchmark: tau2
experiment_name: hy3_tau2
tau2:
  task_split: test
  solver_mode: conversational
  max_steps: 200
  user_llm: openai/hy4
  user_llm_args:
    temperature: 0.0
    reasoning_effort: high
run:
  num_runs: 5
  parallel: 24
kind: inference
expel:
  insights_path: outputs/baselines/expel/memory/hy3_tau2/pool.json
  extraction_model: openai/hy4
  extraction_reasoning_effort: high
  reflection_model: openai/hy4
  reflection_reasoning_effort: high
category: hy3-reproduction
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
cost_accounting:
  enabled: true
  require_complete_estimates: false
