benchmark: appworld
experiment_name: pm_appworld_ctrl
category: predictmem
appworld:
  dataset: test_normal
predictmem:
  enabled: true
  predictor_model: openai/hy4
  judge_model: openai/hy4
  predictor_reasoning_effort: high
  tau_admit: 0.55
  control_eps: 0.25
  horizon: 1
  beam: 1
  gamma: 0.9
  gate:
    enabled: true
    tau_warn: 0.45
    tau_block: 0.75
  predict_consequential_only: true
run:
  num_runs: 5
  parallel: 8
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
cost_accounting:
  enabled: true
  require_complete_estimates: false
