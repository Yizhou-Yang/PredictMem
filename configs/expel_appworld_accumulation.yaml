benchmark: appworld
experiment_name: hy3_appworld
appworld:
  dataset: train
accumulation:
  max_failures: 4
  num_success_to_continue: 1
  extraction_model: openai/hy4
run:
  parallel: 12
kind: accumulation
category: hy3-reproduction
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
expel:
  extraction_model: openai/hy4
  extraction_reasoning_effort: high
  reflection_model: openai/hy4
  reflection_reasoning_effort: high
cost_accounting:
  enabled: true
  require_complete_estimates: false
