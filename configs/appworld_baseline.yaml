benchmark: appworld
experiment_name: hy3_appworld_baseline
category: hy3-reproduction
appworld:
  dataset: test_normal
run:
  num_runs: 5
  parallel: 12
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
accumulation:
  extraction_model: openai/hy4
  extraction_reasoning_effort: null
generation:
  explorer_model: openai/hy4
  explorer_reasoning_effort: high
  judge_model: openai/hy4
  judge_reasoning_effort: high
cost_accounting:
  enabled: true
  require_complete_estimates: false
memory:
  enabled: false
