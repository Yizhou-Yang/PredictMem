benchmark: tau2
experiment_name: hy4_ace_airline_accum
tau2:
  task_split: train
  solver_mode: conversational
  max_steps: 200
  user_llm: openai/hy4
  user_llm_args:
    temperature: 0.0
    reasoning_effort: high
  domain: airline
accumulation:
  max_failures: 1
  num_success_to_continue: 1
  extraction_model: openai/hy4
kind: accumulation
ace:
  playbook_path: outputs/baselines/ace/memory/hy4_airline/playbook.txt
  reflector_model: openai/hy4
  reflector_reasoning_effort: high
  curator_model: openai/hy4
  curator_reasoning_effort: high
category: hy3-reproduction
agent:
  model: openai/hy4
  temperature: 1.0
  reasoning_effort: high
  max_turns: 30
run:
  parallel: 1
cost_accounting:
  enabled: true
  require_complete_estimates: false
